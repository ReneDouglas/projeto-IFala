# ========================================
# DOCKER COMPOSE - AMBIENTE DE PRODUÇÃO
# ========================================
# Servidor alvo: 2GB RAM / 30GB HD
#
# Orçamento de memória (2048MB total):
#   SO + Docker daemon  : ~400MB reservado
#   ifala-backend       : 700MB  (heap máx 512m + metaspace + code cache + off-heap)
#   postgres            : 300MB  (shared_buffers=128MB + conexões)
#   prometheus          : 128MB
#   grafana             : 150MB
#   loki                : 100MB
#   promtail            :  64MB
#   nginx-gateway       :  64MB
#   ifala-frontend      :  64MB
#   ─────────────────────────────────────
#   Total containers    : ~1570MB  ✓ margem de ~80MB

services:
  # ----------------------------------------
  # PostgreSQL - Banco de Dados
  # ----------------------------------------
  postgres:
    image: postgres:16
    container_name: ifala-db-prd
    restart: always
    mem_limit: 300m
    mem_reservation: 128m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      TZ: America/Sao_Paulo
    ports:
      - '127.0.0.1:5432:5432'
    command:
      - 'postgres'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements'
      - '-c'
      # Reduzido de 200 → 30: Spring Boot HikariCP usa max 15 conexões (ver application-prod.properties)
      # 200 conexões reservam ~200MB só de connection overhead + slots de memória
      - 'max_connections=30'
      - '-c'
      # Reduzido de 256MB → 128MB: regra ~25% da RAM disponível para o Postgres (~512MB após SO+app)
      - 'shared_buffers=128MB'
      - '-c'
      # Reduzido de 1GB → 512MB: apenas dica para o planner, não aloca memória real
      - 'effective_cache_size=512MB'
      - '-c'
      # Reduzido de 8MB → 4MB: 30 conexões × 4MB = 120MB máximo por operação de sort/hash
      - 'work_mem=4MB'
      - '-c'
      # Reduzido de 128MB → 64MB: usado apenas em VACUUM, CREATE INDEX, etc.
      - 'maintenance_work_mem=64MB'
    volumes:
      - pgdata_prd:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ifala-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------
  # Backend - Spring Boot API
  # ----------------------------------------
  ifala-backend:
    build:
      context: ./apps/ifala-backend
      dockerfile: Dockerfile.prd
    container_name: ifala-backend-prd
    restart: always
    # mem_limit deve ser ≥ Xmx(512m) + Metaspace(128m) + CodeCache(64m) + off-heap JVM (~100m)
    # App consome 617MB hoje → 700MB dá margem para picos sem permitir consumo irrestrito
    mem_limit: 700m
    mem_reservation: 256m
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - provas_data_prd:/app/uploads/provas
    networks:
      - ifala-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:8080/actuator/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ----------------------------------------
  # Frontend - React + NGINX
  # ----------------------------------------
  ifala-frontend:
    build:
      context: ./apps/ifala-frontend
      dockerfile: Dockerfile.prd
      args:
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY}
    container_name: ifala-frontend-prd
    restart: always
    # NGINX com arquivos estáticos — uso de memória mínimo
    mem_limit: 64m
    mem_reservation: 16m
    networks:
      - ifala-network
    depends_on:
      - ifala-backend
    # healthcheck:
    #   test:
    #     [
    #       'CMD',
    #       'wget',
    #       '--quiet',
    #       '--tries=1',
    #       '--spider',
    #       'http://localhost:80',
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # ----------------------------------------
  # Prometheus - Métricas
  # ----------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus-prd
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prd:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Reduzido de 30d → 15d para economizar disco (30GB HD)
      - '--storage.tsdb.retention.time=15d'
      # Limite de disco: com apenas 1 target (Spring Boot), 15d gera ~300-500MB
      # 2GB é um teto seguro que evita que o Prometheus consuma o HD inteiro
      - '--storage.tsdb.retention.size=2GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      # Desativa scrape de auto-descoberta desnecessário
      - '--web.enable-lifecycle'
    networks:
      - ifala-network
    depends_on:
      - ifala-backend

  # ----------------------------------------
  # Grafana - Visualização e Dashboards
  # ----------------------------------------
  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: grafana-prd
    restart: always
    mem_limit: 150m
    mem_reservation: 64m
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ''
      GF_SERVER_ROOT_URL: https://ifala.cacor.ifpi.edu.br/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: true
      GF_ANALYTICS_REPORTING_ENABLED: false
      GF_ANALYTICS_CHECK_FOR_UPDATES: false
      # Desativa telemetria e envio de dados para a Grafana Labs
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false
    volumes:
      - ./monitoring/grafana/provisioning/:/etc/grafana/provisioning/:ro
      - ./monitoring/grafana/dashboards/:/var/lib/grafana/dashboards/:ro
      - grafana_data_prd:/var/lib/grafana
    networks:
      - ifala-network
    depends_on:
      - prometheus
      - loki

  # ----------------------------------------
  # Loki - Agregação de Logs
  # ----------------------------------------
  loki:
    image: grafana/loki:2.9.5
    container_name: loki-prd
    restart: always
    mem_limit: 100m
    mem_reservation: 50m
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data_prd:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ifala-network

  # ----------------------------------------
  # Promtail - Coletor de Logs
  # ----------------------------------------
  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail-prd
    restart: always
    mem_limit: 64m
    mem_reservation: 32m
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions_prd:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ifala-network
    depends_on:
      - loki

  # ----------------------------------------
  # NGINX Gateway - Ponto único de entrada
  # ----------------------------------------
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: nginx-gateway-prd
    restart: always
    mem_limit: 64m
    mem_reservation: 16m
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs/ifala.cacor.ifpi.edu.br.crt:/etc/nginx/ssl/ifala.cacor.ifpi.edu.br.crt:ro
      - ../certs/ifala.cacor.ifpi.edu.br.key:/etc/nginx/ssl/ifala.cacor.ifpi.edu.br.key:ro
    networks:
      - ifala-network
    depends_on:
      - ifala-frontend
      - ifala-backend
      - grafana
    # healthcheck:
    #   test:
    #     [
    #       'CMD',
    #       'wget',
    #       '--quiet',
    #       '--tries=1',
    #       '--spider',
    #       '--no-check-certificate',
    #       'https://localhost:443',
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

# ----------------------------------------
# Networks
# ----------------------------------------
networks:
  ifala-network:
    driver: bridge

# ----------------------------------------
# Volumes Persistentes
# ----------------------------------------
volumes:
  pgdata_prd:
    external: true # Volume criado manualmente - protegido contra 'docker compose down -v'
  provas_data_prd:
    external: true
  grafana_data_prd:
    driver: local
  loki_data_prd:
    driver: local
  promtail_positions_prd:
    driver: local
  prometheus_data_prd:
    driver: local
